<!-- @dsCard group="Forms" height=420 subtitle="Sign-in card over the brand field" -->
<!doctype html><html><head><meta charset="utf-8"></head><body>
<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--line);max-width:860px">
<div style="background:var(--zr-sage);color:var(--zr-navy);padding:var(--space-6);display:flex;flex-direction:column;justify-content:space-between;min-height:340px"><div class="mark" style="color:var(--zr-navy)">ZR3I</div><div><div class="display" style="font-size:26px;line-height:32px">Facts about every parcel, with the evidence attached.</div><div style="margin-top:var(--space-3);font-size:12px;border-top:1px solid rgba(17,29,41,.4);padding-top:var(--space-2)">a DigiWell product</div></div></div>
<div style="background:var(--surface);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4)">
<div class="title" style="font-family:var(--font-display);font-size:22px;line-height:28px">Sign in</div>
<div class="zr-field"><label for="a">Work email</label><input id="a" class="zr-in ltr" type="email"></div>
<div class="zr-field"><label for="b">Password</label><input id="b" class="zr-in ltr" type="password"></div>
<button class="zr-btn primary">Continue</button>
<div style="display:flex;justify-content:space-between"><button class="zr-btn text">Forgot password</button><button class="zr-btn text">Request access</button></div></div></div>
</body></html>
