<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:0;background:var(--ground)}
svg{display:block;width:960px;height:300px}
.g{fill:var(--ground)}.brand{fill:var(--brand);rx:var(--radius-md)}.sage{fill:var(--zr-sage);rx:var(--radius-md)}.mist{fill:var(--zr-mist);rx:var(--radius-md)}.amber{fill:var(--zr-amber);rx:var(--radius-md)}.slab{fill:var(--ink);rx:var(--radius-md)}.ember{fill:var(--zr-ember)}
.cut{fill:var(--ground);rx:var(--radius-sm)}.amb{fill:var(--zr-amber);rx:var(--radius-sm)}.sg{fill:var(--zr-sage);rx:var(--radius-sm)}
.name{font:700 120px/1 var(--font-display);fill:var(--ink)}.tag{font:400 13px/20px var(--font-sans);fill:var(--ink-muted)}
</style></head><body>
