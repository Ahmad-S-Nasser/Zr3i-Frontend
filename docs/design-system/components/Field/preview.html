<!-- @dsCard group="Forms" height=300 subtitle="Text, password, one-time code, consent" -->
<!doctype html><html><head><meta charset="utf-8"></head><body>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--space-5)">
<div style="display:flex;flex-direction:column;gap:var(--space-4)">
<div class="zr-field"><label for="e">Work email</label><input id="e" class="zr-in ltr" value="name@agricash.example" type="email"><span class="zr-hint">Use the address your invitation was sent to.</span></div>
<div class="zr-field"><label for="p">Password</label><input id="p" class="zr-in ltr" type="password" value="••••••••••"><span class="zr-err"><svg width="14" height="14" viewBox="0 0 12 12" aria-hidden="true" style="flex:none;margin-top:3px"><path d="M6 1 11.5 11H.5z" fill="currentColor"/></svg>Password or email is not recognised. Five attempts remain.</span></div>
<div class="zr-field"><label>One-time code</label><div style="display:flex;gap:var(--space-2)" class="ltr"><input class="zr-in mono" style="width:44px;text-align:center;padding:0" value="4"><input class="zr-in mono" style="width:44px;text-align:center;padding:0" value="1"><input class="zr-in mono" style="width:44px;text-align:center;padding:0" value="7"><input class="zr-in mono" style="width:44px;text-align:center;padding:0"><input class="zr-in mono" style="width:44px;text-align:center;padding:0"><input class="zr-in mono" style="width:44px;text-align:center;padding:0"></div></div>
</div>
<div dir="rtl" style="display:flex;flex-direction:column;gap:var(--space-4)">
<div class="zr-field"><label for="e2">البريد الإلكتروني للعمل</label><input id="e2" class="zr-in ltr" value="name@agricash.example"><span class="zr-hint">استخدم العنوان الذي وصلتك عليه الدعوة.</span></div>
<label style="display:flex;gap:var(--space-3);align-items:flex-start;min-height:var(--tap-min)"><input type="checkbox" checked style="width:24px;height:24px;margin:0;accent-color:var(--brand)"><span>أوافق على مشاركة نتائج قطعي مع الجهة المحددة ولمدة محددة.</span></label>
</div></div>
</body></html>
