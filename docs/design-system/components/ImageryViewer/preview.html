<!-- @dsCard group="Imagery" height=560 subtitle="Satellite chip with boundary, pixel grid, layers, date" -->
<!doctype html><html><head><meta charset="utf-8"></head><body>
<div class="card" style="max-width:820px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(220px,1fr);gap:var(--space-4)">
<div>
<div class="zr-tabs" role="tablist"><button class="zr-tab" role="tab" aria-selected="true">True colour</button><button class="zr-tab" role="tab" aria-selected="false">NDVI</button><button class="zr-tab" role="tab" aria-selected="false">Scene mask</button></div>
<div style="position:relative;margin-top:var(--space-3);border:1px solid var(--line-strong);border-radius:var(--radius-md);overflow:hidden;background:var(--sunken)">
<svg viewBox="0 0 400 300" width="100%" role="img" aria-label="Placeholder chip: declared boundary 10.0 feddan, measured footprint 7.3 feddan, 10 metre pixel grid">
<rect width="400" height="300" fill="var(--img-true)"/>
<rect x="0" y="0" width="400" height="120" fill="#7b8a52"/><rect x="0" y="200" width="400" height="100" fill="#8a7a4c"/><rect x="250" y="40" width="150" height="230" fill="#5f6f42"/>
<g stroke="rgba(255,255,255,.35)" stroke-width=".6"><path d="M0 20H400M0 40H400M0 60H400M0 80H400M0 100H400M0 120H400M0 140H400M0 160H400M0 180H400M0 200H400M0 220H400M0 240H400M0 260H400M0 280H400M20 0V300M40 0V300M60 0V300M80 0V300M100 0V300M120 0V300M140 0V300M160 0V300M180 0V300M200 0V300M220 0V300M240 0V300M260 0V300M280 0V300M300 0V300M320 0V300M340 0V300M360 0V300M380 0V300"/></g>
<polygon points="70,70 250,60 270,220 90,236" fill="none" stroke="var(--zr-navy)" stroke-width="5"/>
<polygon points="70,70 250,60 270,220 90,236" fill="none" stroke="var(--img-boundary)" stroke-width="2.5"/>
<polygon points="90,90 232,84 242,172 104,186" fill="none" stroke="var(--zr-navy)" stroke-width="5" stroke-dasharray="7 5"/>
<polygon points="90,90 232,84 242,172 104,186" fill="none" stroke="var(--img-measured)" stroke-width="2.5" stroke-dasharray="7 5"/>
<rect x="8" y="8" width="150" height="22" rx="4" fill="var(--zr-navy)"/><text x="16" y="23" font-size="11" fill="var(--zr-mist)" font-family="var(--font-mono)">PLACEHOLDER · SYNTHETIC</text>
<rect x="8" y="270" width="52" height="22" rx="4" fill="var(--zr-navy)"/><text x="16" y="285" font-size="11" fill="var(--zr-mist)" font-family="var(--font-mono)">10 m px</text></svg></div>
<label class="zr-hint" for="d" style="display:block;margin-top:var(--space-3)">Scene date: 2026-03-14 · 8 of 11 scenes</label>
<input id="d" type="range" min="1" max="11" value="8" style="width:100%;min-height:var(--tap-min);accent-color:var(--brand)"></div>
<div style="display:flex;flex-direction:column;gap:var(--space-3)">
<div class="title">Parcel P-0147</div>
<div class="mono ltr muted">Sentinel-2 L2A · 10 m · cloud 4%</div>
<div style="display:flex;flex-direction:column;gap:6px;font-size:13px"><div style="display:flex;gap:8px;align-items:center"><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" stroke="var(--img-boundary)" stroke-width="3"/></svg>Declared 10.0 fd</div><div style="display:flex;gap:8px;align-items:center"><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" stroke="var(--img-measured)" stroke-width="3" stroke-dasharray="6 4"/></svg>Measured 7.3 fd (±4.6%)</div></div>
<div class="banner neutral">Gap 27%, outside the ±4.6% measurement noise.</div>
<div style="display:flex;gap:var(--space-2);flex-wrap:wrap"><button class="zr-btn">Download chip (GeoTIFF)</button></div></div></div>
</body></html>
