<!doctype html><html><head><meta charset="utf-8"></head><body>
<div class="card ltr" style="max-width:720px">
<div class="title">Hit rate by size class</div>
<svg viewBox="0 0 680 220" width="100%" role="img" aria-label="Hit rate with 95 percent interval for four size classes. Kill line 70 percent, target 80 percent.">
<g font-family="var(--font-mono)" font-size="11" fill="var(--ink-muted)">
<rect x="48" y="10" width="620" height="170" fill="none"/>
<line x1="48" y1="180" x2="668" y2="180" stroke="var(--line-strong)"/>
<line x1="48" y1="10" x2="48" y2="180" stroke="var(--line-strong)"/>
<text x="40" y="184" text-anchor="end">0</text><text x="40" y="95" text-anchor="end">50</text><text x="40" y="14" text-anchor="end">100</text>
<line x1="48" y1="61" x2="668" y2="61" stroke="var(--confirmed)" stroke-dasharray="6 4"/><text x="664" y="55" text-anchor="end" fill="var(--confirmed)">target 80</text>
<line x1="48" y1="78" x2="668" y2="78" stroke="var(--flagged)" stroke-dasharray="2 3"/><text x="664" y="92" text-anchor="end" fill="var(--flagged)">kill line 70</text>
</g>
<g stroke="var(--ink)" stroke-width="2" fill="var(--ink)">
<line x1="120" y1="64" x2="120" y2="160"/><line x1="112" y1="64" x2="128" y2="64"/><line x1="112" y1="160" x2="128" y2="160"/><circle cx="120" cy="116" r="5"/>
<line x1="270" y1="52" x2="270" y2="104"/><line x1="262" y1="52" x2="278" y2="52"/><line x1="262" y1="104" x2="278" y2="104"/><circle cx="270" cy="82" r="5"/>
<line x1="420" y1="36" x2="420" y2="76"/><line x1="412" y1="36" x2="428" y2="36"/><line x1="412" y1="76" x2="428" y2="76"/><circle cx="420" cy="56" r="5"/>
<line x1="570" y1="40" x2="570" y2="92"/><line x1="562" y1="40" x2="578" y2="40"/><line x1="562" y1="92" x2="578" y2="92"/><circle cx="570" cy="66" r="5"/>
</g>
<g font-size="12" fill="var(--ink)" text-anchor="middle" font-family="var(--font-sans)"><text x="120" y="200">under 1 fd</text><text x="270" y="200">1 to 2 fd</text><text x="420" y="200">2 to 5 fd</text><text x="570" y="200">5+ fd</text></g></svg>
<div class="zr-hint">Illustrative synthetic values. Dots are point hit rates, bars are Wilson 95% intervals, one per size class. No pooled figure.</div></div>
</body></html>
